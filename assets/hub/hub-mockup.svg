<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Lume hub, dark theme: sidebar with Recent, My Projects, Start and Community; a grid of project cards and a row of template cards.">
  <!-- Design target for the hub. Geometry and colours are the tokens in hub/src/theme.hpp: card 320x208, thumbnail 148, text baselines 166/184/200, top bar 56, sidebar 216, footer 28, padding 24, gaps 16, radius 10, accent #4FD1C5. -->
  <title>Lume hub - step 1</title>
  <defs>
    <linearGradient id="thumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B222C"/>
      <stop offset="1" stop-color="#0D1116"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#414E60"/>
      <stop offset="0.55" stop-color="#242C38"/>
      <stop offset="1" stop-color="#141A22"/>
    </radialGradient>
    <linearGradient id="tintTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1C5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tintViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F87F1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8F87F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tintAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B45E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F5B45E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="thumbClip"><rect x="0" y="0" width="320" height="148" rx="10"/></clipPath>
  </defs>

  <style>
    .ui { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
    .hi { fill: #E9EDF3; }
    .bd { fill: #B9C2CF; }
    .dim { fill: #7C8796; }
    .faint { fill: #545E6C; }
    .acc { fill: #4FD1C5; }
  </style>

  <rect width="1280" height="760" fill="#0B0D10"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#111419"/>
  <rect x="0" y="56" width="1280" height="1" fill="#232A35"/>

  <g transform="translate(24,18)">
    <rect width="20" height="20" rx="5" fill="#4FD1C5" fill-opacity="0.14" stroke="#4FD1C5" stroke-opacity="0.5"/>
    <path d="M4 13.5 L10 17 L16 13.5 L16 7 L10 3.5 L4 7 Z" fill="none" stroke="#4FD1C5" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M4 7 L10 10.5 L16 7 M10 10.5 L10 17" fill="none" stroke="#4FD1C5" stroke-width="1.2"/>
  </g>
  <text class="ui hi" x="52" y="35" font-size="17" font-weight="600" letter-spacing="0.2">lume</text>
  <text class="ui faint" x="100" y="35" font-size="11">hub</text>

  <!-- search -->
  <rect x="952" y="15" width="220" height="26" rx="6" fill="#0E1116" stroke="#232A35"/>
  <g transform="translate(964,22)" stroke="#545E6C" stroke-width="1.4" fill="none">
    <circle cx="5.5" cy="5.5" r="4.2"/>
    <path d="M8.7 8.7 L12 12"/>
  </g>
  <text class="ui faint" x="984" y="32" font-size="12">Search projects</text>
  <rect x="1184" y="15" width="72" height="26" rx="6" fill="#4FD1C5"/>
  <text class="ui" x="1220" y="32" font-size="12" font-weight="600" fill="#08171A" text-anchor="middle">New</text>

  <!-- sidebar -->
  <rect x="0" y="57" width="216" height="675" fill="#111419"/>
  <rect x="216" y="57" width="1" height="675" fill="#232A35"/>

  <g class="ui">
    <!-- selected: Recent -->
    <rect x="12" y="80" width="192" height="30" rx="8" fill="#1E242D"/>
    <rect x="12" y="86" width="3" height="18" rx="1.5" fill="#4FD1C5"/>
    <text class="hi" x="28" y="100" font-size="13">Recent</text>
    <text class="dim" x="196" y="100" font-size="12" text-anchor="end">3</text>

    <text class="bd" x="28" y="138" font-size="13">My Projects</text>
    <text class="dim" x="196" y="138" font-size="12" text-anchor="end">4</text>

    <text class="bd" x="28" y="176" font-size="13">Start</text>
    <text class="dim" x="196" y="176" font-size="12" text-anchor="end">5</text>

    <text class="dim" x="28" y="214" font-size="13">Community</text>
    <text class="faint" x="196" y="214" font-size="11" text-anchor="end">soon</text>
  </g>

  <g class="ui">
    <text class="faint" x="20" y="654" font-size="10" letter-spacing="1.2">SORT</text>
    <rect x="12" y="664" width="192" height="28" rx="6" fill="#0E1116" stroke="#232A35"/>
    <text class="bd" x="24" y="682" font-size="12">Recently opened</text>
    <path d="M184 677 l6 6 l6 -6" fill="none" stroke="#7C8796" stroke-width="1.4"/>
    <text class="faint" x="20" y="716" font-size="10">lume 0.1.0 &#183; step 1</text>
  </g>

  <!-- content header -->
  <text class="ui hi" x="240" y="96" font-size="16" font-weight="600">Recent</text>
  <text class="ui dim" x="1256" y="95" font-size="11" text-anchor="end">3 of 4 projects &#183; dark is the default, not a mode</text>

  <!-- card 1: Grey Planet -->
  <g transform="translate(240,112)">
    <rect width="320" height="208" rx="10" fill="#171B22"/>
    <g clip-path="url(#thumbClip)">
      <rect width="320" height="148" fill="url(#thumb)"/>
      <rect width="320" height="148" fill="url(#tintTeal)"/>
      <path d="M0 118 L320 96" stroke="#2E3846" stroke-width="1"/>
      <circle cx="150" cy="74" r="40" fill="url(#planet)"/>
      <ellipse cx="150" cy="120" rx="46" ry="7" fill="#05070A" fill-opacity="0.55"/>
      <path d="M124 60 q14 -10 30 -4" fill="none" stroke="#8FA3B8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="262" cy="30" r="4" fill="#4FD1C5" fill-opacity="0.85"/>
    </g>
    <rect x="246" y="124" width="60" height="16" rx="4" fill="#111419" fill-opacity="0.92"/>
    <text class="ui acc" x="276" y="135" font-size="10" text-anchor="middle">scene</text>
    <text class="ui hi" x="14" y="166" font-size="14" font-weight="600">Grey Planet</text>
    <text class="ui dim" x="14" y="184" font-size="11">Edited 2h ago &#183; one material</text>
    <text class="mono faint" x="14" y="200" font-size="10">grey-planet-1a2b3c4d</text>
    <rect x="0.5" y="0.5" width="319" height="207" rx="9.5" fill="none" stroke="#232A35"/>
  </g>

  <!-- card 2: Bravo Tower (hovered) -->
  <g transform="translate(576,112)">
    <rect width="320" height="208" rx="10" fill="#171B22"/>
    <g clip-path="url(#thumbClip)">
      <rect width="320" height="148" fill="url(#thumb)"/>
      <rect width="320" height="148" fill="url(#tintAmber)"/>
      <path d="M0 122 L320 122" stroke="#2E3846" stroke-width="1"/>
      <g stroke="#3B4759" stroke-width="1" fill="#232C39">
        <path d="M132 104 l34 14 l34 -14 l-34 -14 z"/>
        <path d="M132 84 l34 14 l34 -14 l-34 -14 z" fill="#28323f"/>
        <path d="M132 64 l34 14 l34 -14 l-34 -14 z" fill="#2d3846"/>
      </g>
    </g>
    <rect x="240" y="124" width="66" height="16" rx="4" fill="#111419" fill-opacity="0.92"/>
    <text class="ui acc" x="273" y="135" font-size="10" text-anchor="middle">physics</text>
    <!-- hover affordance: the secondary actions hub_state exposes -->
    <rect x="14" y="120" width="54" height="22" rx="6" fill="#4FD1C5"/>
    <text class="ui" x="41" y="135" font-size="11" font-weight="600" fill="#08171A" text-anchor="middle">Open</text>
    <rect x="74" y="120" width="22" height="22" rx="6" fill="#1E242D" stroke="#2E3846"/>
    <g fill="#B9C2CF"><circle cx="80" cy="131" r="1.5"/><circle cx="85" cy="131" r="1.5"/><circle cx="90" cy="131" r="1.5"/></g>
    <text class="ui hi" x="14" y="166" font-size="14" font-weight="600">Bravo Tower</text>
    <text class="ui dim" x="14" y="184" font-size="11">Edited yesterday &#183; 24 bodies</text>
    <text class="mono faint" x="14" y="200" font-size="10">bravo-tower-9f8e7d6c</text>
    <rect x="-0.5" y="-0.5" width="321" height="209" rx="10" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>
  </g>

  <!-- card 3: imported, with an autosave -->
  <g transform="translate(912,112)">
    <rect width="320" height="208" rx="10" fill="#171B22"/>
    <g clip-path="url(#thumbClip)">
      <rect width="320" height="148" fill="url(#thumb)"/>
      <rect width="320" height="148" fill="url(#tintViolet)"/>
      <path d="M0 118 L320 132" stroke="#2E3846" stroke-width="1"/>
      <path d="M150 30 q16 26 12 52 l-24 0 q-4 -26 12 -52 z" fill="#2B3442" stroke="#48566B" stroke-width="1"/>
      <path d="M138 82 l-12 16 l14 -4 z M162 82 l12 16 l-14 -4 z" fill="#3A465A"/>
      <rect x="120" y="20" width="60" height="84" fill="none" stroke="#8F87F1" stroke-opacity="0.6" stroke-dasharray="4 4"/>
    </g>
    <rect x="238" y="124" width="68" height="16" rx="4" fill="#111419" fill-opacity="0.92"/>
    <text class="ui acc" x="272" y="135" font-size="10" text-anchor="middle">autosave</text>
    <text class="ui hi" x="14" y="166" font-size="14" font-weight="600">Rocket (imported)</text>
    <text class="ui dim" x="14" y="184" font-size="11">Opened 4m ago &#183; model</text>
    <text class="mono faint" x="14" y="200" font-size="10">rocket-imported-4c2f</text>
    <rect x="0.5" y="0.5" width="319" height="207" rx="9.5" fill="none" stroke="#232A35"/>
  </g>

  <!-- start row -->
  <text class="ui hi" x="240" y="364" font-size="16" font-weight="600">Start a new project</text>
  <text class="ui dim" x="1256" y="363" font-size="11" text-anchor="end">5 templates &#183; press N</text>

  <!-- ghost: new project -->
  <g transform="translate(240,380)">
    <rect width="320" height="208" rx="10" fill="#12161C"/>
    <rect x="0.5" y="0.5" width="319" height="207" rx="9.5" fill="none" stroke="#4FD1C5" stroke-opacity="0.55" stroke-dasharray="6 5"/>
    <circle cx="160" cy="70" r="22" fill="none" stroke="#4FD1C5" stroke-opacity="0.6"/>
    <path d="M160 60 v20 M150 70 h20" stroke="#4FD1C5" stroke-width="1.6"/>
    <text class="ui hi" x="14" y="166" font-size="14" font-weight="600">New project</text>
    <text class="ui dim" x="14" y="184" font-size="11">Empty scene, your settings</text>
    <text class="mono faint" x="14" y="200" font-size="10">Ctrl+N</text>
  </g>

  <!-- template: empty scene -->
  <g transform="translate(576,380)">
    <rect width="320" height="208" rx="10" fill="#171B22"/>
    <g clip-path="url(#thumbClip)">
      <rect width="320" height="148" fill="url(#thumb)"/>
      <path d="M60 108 L160 62 L260 108 L160 152 Z" fill="#161C24" stroke="#2E3846"/>
      <g stroke="#39445A" stroke-width="1">
        <path d="M110 85 L160 108 L160 152 L110 129 Z"/>
        <path d="M210 85 L160 108 L160 152 L210 129 Z"/>
        <path d="M110 85 L160 62 L210 85"/>
      </g>
      <rect x="150" y="34" width="20" height="20" rx="4" fill="none" stroke="#4FD1C5" stroke-opacity="0.7"/>
    </g>
    <rect x="248" y="124" width="58" height="16" rx="4" fill="#111419" fill-opacity="0.92"/>
    <text class="ui acc" x="277" y="135" font-size="10" text-anchor="middle">generic3d</text>
    <text class="ui hi" x="14" y="166" font-size="14" font-weight="600">Empty Scene</text>
    <text class="ui dim" x="14" y="184" font-size="11">Camera, light, grid. Nothing else.</text>
    <text class="mono faint" x="14" y="200" font-size="10">empty-scene &#183; starts empty</text>
    <rect x="0.5" y="0.5" width="319" height="207" rx="9.5" fill="none" stroke="#232A35"/>
  </g>

  <!-- template: model import -->
  <g transform="translate(912,380)">
    <rect width="320" height="208" rx="10" fill="#171B22"/>
    <g clip-path="url(#thumbClip)">
      <rect width="320" height="148" fill="url(#thumb)"/>
      <path d="M110 110 L160 88 L210 110 L160 132 Z" fill="#202834" stroke="#39445A"/>
      <path d="M110 110 v-28 L160 60 L210 82 v28" fill="none" stroke="#39445A"/>
      <path d="M160 88 v44" stroke="#2E3846"/>
      <path d="M150 34 h20 M160 24 v20" stroke="#F5B45E" stroke-opacity="0.8" stroke-width="1.6"/>
    </g>
    <rect x="250" y="124" width="56" height="16" rx="4" fill="#111419" fill-opacity="0.92"/>
    <text class="ui acc" x="278" y="135" font-size="10" text-anchor="middle">import</text>
    <text class="ui hi" x="14" y="166" font-size="14" font-weight="600">Model Import</text>
    <text class="ui dim" x="14" y="184" font-size="11">Drop an FBX, OBJ or glTF file</text>
    <text class="mono faint" x="14" y="200" font-size="10">model-import &#183; z-up</text>
    <rect x="0.5" y="0.5" width="319" height="207" rx="9.5" fill="none" stroke="#232A35"/>
  </g>

  <!-- footer -->
  <rect x="0" y="732" width="1280" height="28" fill="#111419"/>
  <rect x="0" y="732" width="1280" height="1" fill="#232A35"/>
  <text class="mono dim" x="240" y="750" font-size="10">~/.local/share/Lume/hub/projects &#183; autosave on, every 5 min</text>
  <text class="ui faint" x="1256" y="750" font-size="10" text-anchor="end">step 2 adds the viewport, the window, and these thumbnails as renders</text>
</svg>
